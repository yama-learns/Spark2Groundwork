<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040" role="img" aria-labelledby="title desc">
<title id="title">從構想到提案，每一輪都留下依據</title><desc id="desc">研究證據、機器檢查與人工已閱分開</desc>
<style>text{font-family:'Microsoft JhengHei','PingFang TC','Noto Sans CJK TC','Segoe UI',sans-serif;fill:#142b40}.muted{fill:#506779}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7b919f"/></marker></defs>
<rect width="1280" height="1040" rx="24" fill="#f4f7fa"/>
<text x="48" y="44" font-size="14" font-weight="700" style="fill:#087f81">Spark2Groundwork  /  v1.4.5  /  研究協作</text>
<text x="48" y="91" font-size="34" font-weight="700" style="fill:#142b40">從構想到提案，每一輪都留下依據</text>
<text x="48" y="125" font-size="19" font-weight="400" style="fill:#506779">AI 協助整理與檢查；研究判斷與已閱確認由你完成。</text>
<rect x="48" y="158" width="356" height="96" rx="18" fill="#fff" stroke="#d7e1e8"/>
<text x="70" y="196" font-size="23" font-weight="700" style="fill:#142b40">原始構想</text>
<text x="70" y="227" font-size="17" font-weight="400" style="fill:#506779">保留動機與未知</text>
<path d="M413 206L453 206" fill="none" stroke="#7b919f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="462" y="158" width="356" height="96" rx="18" fill="#fff" stroke="#d7e1e8"/>
<text x="484" y="196" font-size="23" font-weight="700" style="fill:#142b40">猜想台帳</text>
<text x="484" y="227" font-size="17" font-weight="400" style="fill:#506779">記錄理由與反證條件</text>
<path d="M827 206L867 206" fill="none" stroke="#7b919f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="876" y="158" width="356" height="96" rx="18" fill="#fff" stroke="#d7e1e8"/>
<text x="898" y="196" font-size="23" font-weight="700" style="fill:#142b40">研究問題與提案</text>
<text x="898" y="227" font-size="17" font-weight="400" style="fill:#506779">明示假設與適用範圍</text>
<rect x="48" y="275" width="356" height="96" rx="18" fill="#fff" stroke="#d7e1e8"/>
<text x="70" y="313" font-size="23" font-weight="700" style="fill:#142b40">文獻與提取文字</text>
<text x="70" y="344" font-size="17" font-weight="400" style="fill:#506779">保留來源與定位</text>
<path d="M413 323L453 323" fill="none" stroke="#7b919f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="462" y="275" width="356" height="96" rx="18" fill="#fff" stroke="#d7e1e8"/>
<text x="484" y="313" font-size="23" font-weight="700" style="fill:#142b40">主張台帳</text>
<text x="484" y="344" font-size="17" font-weight="400" style="fill:#506779">逐字錨點、頁碼與查證狀態</text>
<path d="M827 323L867 323" fill="none" stroke="#7b919f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="876" y="275" width="356" height="96" rx="18" fill="#fff" stroke="#d7e1e8"/>
<text x="898" y="313" font-size="23" font-weight="700" style="fill:#142b40">研究論述</text>
<text x="898" y="344" font-size="17" font-weight="400" style="fill:#506779">判讀證據是否支持推論</text>
<rect x="48" y="400" width="574" height="172" rx="18" fill="#eaf1fb" stroke="#cfdded"/>
<rect x="644" y="400" width="588" height="172" rx="18" fill="#e7f4f1" stroke="#badbd4"/>
<text x="72" y="440" font-size="23" font-weight="700" style="fill:#2764ae">機器能協助檢查</text>
<text x="72" y="477" font-size="18" font-weight="400" style="fill:#506779">錨點是否出現在文字中、欄位是否齊全</text>
<text x="72" y="506" font-size="18" font-weight="400" style="fill:#506779">引用檔案是否存在、部分跨檔規則是否一致</text>
<text x="72" y="535" font-size="18" font-weight="400" style="fill:#506779">通過／有缺陷／無法判定，必須分清楚</text>
<text x="668" y="440" font-size="23" font-weight="700" style="fill:#087f81">人需要判讀與決定</text>
<text x="668" y="477" font-size="18" font-weight="400" style="fill:#506779">原文是否支持推論、方法是否合適</text>
<text x="668" y="506" font-size="18" font-weight="400" style="fill:#506779">研究結果能否外推、哪些限制必須保留</text>
<text x="668" y="535" font-size="18" font-weight="400" style="fill:#506779">查得到文字，不等於結論成立</text>
<text x="48" y="623" font-size="25" font-weight="700" style="fill:#142b40">每輪工作：先說清任務，再檢視結果</text>
<rect x="48" y="654" width="220" height="112" rx="18" fill="#fff" stroke="#d2e0e2"/>
<text x="64" y="684" font-size="14" font-weight="700" style="fill:#087f81">01</text>
<text x="64" y="717" font-size="20" font-weight="700" style="fill:#142b40">AI 工作</text>
<text x="64" y="746" font-size="16" font-weight="400" style="fill:#506779">留下交接</text>
<path d="M271 710L284 710" fill="none" stroke="#7b919f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="289" y="654" width="220" height="112" rx="18" fill="#fff" stroke="#d2e0e2"/>
<text x="305" y="684" font-size="14" font-weight="700" style="fill:#087f81">02</text>
<text x="305" y="717" font-size="20" font-weight="700" style="fill:#142b40">儲存進度</text>
<text x="305" y="746" font-size="16" font-weight="400" style="fill:#506779">不是人工已閱</text>
<path d="M512 710L525 710" fill="none" stroke="#7b919f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="530" y="654" width="220" height="112" rx="18" fill="#fff" stroke="#d2e0e2"/>
<text x="546" y="684" font-size="14" font-weight="700" style="fill:#087f81">03</text>
<text x="546" y="717" font-size="20" font-weight="700" style="fill:#142b40">檢查與查看變更</text>
<text x="546" y="746" font-size="16" font-weight="400" style="fill:#506779">處理缺陷與未查</text>
<path d="M753 710L766 710" fill="none" stroke="#7b919f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="771" y="654" width="220" height="112" rx="18" fill="#fff" stroke="#d2e0e2"/>
<text x="787" y="684" font-size="14" font-weight="700" style="fill:#087f81">04</text>
<text x="787" y="717" font-size="20" font-weight="700" style="fill:#142b40">你判讀／裁決</text>
<text x="787" y="746" font-size="16" font-weight="400" style="fill:#506779">確實閱讀內容</text>
<path d="M994 710L1007 710" fill="none" stroke="#7b919f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1012" y="654" width="220" height="112" rx="18" fill="#dcf0e9" stroke="#d2e0e2"/>
<text x="1028" y="684" font-size="14" font-weight="700" style="fill:#087f81">05</text>
<text x="1028" y="717" font-size="20" font-weight="700" style="fill:#142b40">記錄快照</text>
<text x="1028" y="746" font-size="16" font-weight="400" style="fill:#506779">看完後由你按</text>
<rect x="48" y="794" width="1184" height="133" rx="18" fill="#fff5e6" stroke="#ead6b4"/>
<text x="72" y="831" font-size="23" font-weight="700" style="fill:#865516">保存 ≠ 已閱；通過檢查 ≠ 研究正確</text>
<text x="72" y="868" font-size="18" font-weight="400" style="fill:#506779">新專案先閱讀初始內容並建立已閱基準；缺可信基準時，不認定沒有未讀工作。</text>
<text x="72" y="897" font-size="18" font-weight="400" style="fill:#506779">AI 不得代按人工已閱；快照可能排除檔案，重要資料仍需完整備份。</text>
<text x="48" y="974" font-size="18" font-weight="400" style="fill:#506779">其他日常入口：同步規則、檢查更新。操作詳見專案內 SETUP.md 與 docs/UPDATE.md。</text>
<text x="48" y="1007" font-size="16" font-weight="400" style="fill:#506779">這是 v1.4.5 工作方式；v2 的新資料夾與新能力另見版本預告。</text>
</svg>
