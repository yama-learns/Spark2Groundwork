<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" width="980" height="700" font-family="Noto Sans CJK TC, Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">
<rect x="0" y="0" width="980" height="700" fill="#ffffff"/>
<defs>
  <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#5a6b7a"/></marker>
</defs>

<text x="490" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2733">框架架構 —— 哪些是框架，哪些是你的</text>
<text x="490" y="49" text-anchor="middle" font-size="12" fill="#4a5b6a">分界不是「重不重要」，是<tspan font-weight="bold" fill="#1a2733">「壞掉之後能不能還原」</tspan>。可還原的整包換新，不可還原的一律不碰。</text>

<!-- L0 T0 -->
<rect x="28" y="68" width="924" height="80" rx="7" fill="#eef4fa" stroke="#3d72a4" stroke-width="1.6"/>
<text x="42" y="90" font-size="13" font-weight="bold" fill="#25547f">T0 必讀法</text>
<text x="42" y="108" font-size="10.5" fill="#4a5b6a">幾乎不動</text>
<text x="42" y="124" font-size="10.5" fill="#4a5b6a">效力最高</text>
<rect x="160" y="80" width="248" height="56" rx="5" fill="#fff" stroke="#3d72a4" stroke-width="1.4"/>
<text x="284" y="101" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a2733">governance/AGENTS.md</text>
<text x="284" y="120" text-anchor="middle" font-size="10" fill="#4a5b6a">查證規範｜學術底線｜決策權</text>
<rect x="424" y="80" width="278" height="56" rx="5" fill="#fff" stroke="#3d72a4" stroke-width="1.4"/>
<text x="563" y="101" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a2733">governance/WORKFLOW_CONSTITUTION.md</text>
<text x="563" y="120" text-anchor="middle" font-size="10" fill="#4a5b6a">拓撲｜證據鏈｜儀式｜寫入範圍｜治理成本上限</text>
<rect x="742" y="92" width="196" height="32" rx="16" fill="#e4f1e9" stroke="#2e7d5b" stroke-width="1.3"/>
<text x="840" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f6b4a">✅ 可整包從 GitHub 換新</text>

<!-- L1 spec -->
<rect x="28" y="160" width="924" height="104" rx="7" fill="#fdf3e7" stroke="#b8802f" stroke-width="1.6"/>
<text x="42" y="182" font-size="13" font-weight="bold" fill="#96661a">T1 規格</text>
<text x="42" y="200" font-size="10.5" fill="#4a5b6a">每出一次事</text>
<text x="42" y="216" font-size="10.5" fill="#4a5b6a">＋一條</text>
<rect x="160" y="172" width="172" height="38" rx="5" fill="#fff" stroke="#b8802f" stroke-width="1.3"/>
<text x="246" y="188" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a2733">RULES.md</text>
<text x="246" y="203" text-anchor="middle" font-size="9.5" fill="#4a5b6a">R-01 – R-35｜編號永久</text>
<rect x="348" y="172" width="172" height="38" rx="5" fill="#fff" stroke="#b8802f" stroke-width="1.3"/>
<text x="434" y="188" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a2733">Incident_Log.md</text>
<text x="434" y="203" text-anchor="middle" font-size="9.5" fill="#4a5b6a">8 個失效家族＋機制</text>
<rect x="536" y="172" width="172" height="38" rx="5" fill="#fff" stroke="#b8802f" stroke-width="1.3"/>
<text x="622" y="188" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a2733">Audit_Protocol.md</text>
<text x="622" y="203" text-anchor="middle" font-size="9.5" fill="#4a5b6a">對抗審計規範</text>
<rect x="160" y="216" width="264" height="38" rx="5" fill="#fff" stroke="#b8802f" stroke-width="1.3"/>
<text x="292" y="232" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a2733">policy/　4 份</text>
<text x="292" y="247" text-anchor="middle" font-size="9.5" fill="#4a5b6a">來源｜模型身分｜交接｜外部工具</text>
<rect x="440" y="216" width="268" height="38" rx="5" fill="#fff" stroke="#b8802f" stroke-width="1.3"/>
<text x="574" y="232" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a2733">profiles/　4 份　＋　prompts/</text>
<text x="574" y="247" text-anchor="middle" font-size="9.5" fill="#4a5b6a">選一個情境　＋　零件庫與三份模板</text>
<rect x="742" y="196" width="196" height="32" rx="16" fill="#e4f1e9" stroke="#2e7d5b" stroke-width="1.3"/>
<text x="840" y="216" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f6b4a">✅ 可整包從 GitHub 換新</text>

<!-- L2 tools -->
<rect x="28" y="276" width="924" height="82" rx="7" fill="#eef2f6" stroke="#5a6b7a" stroke-width="1.6"/>
<text x="42" y="298" font-size="13" font-weight="bold" fill="#3c4a56">工具</text>
<text x="42" y="316" font-size="10.5" fill="#4a5b6a">scripts/</text>
<text x="42" y="332" font-size="10.5" fill="#4a5b6a">harness/</text>
<rect x="160" y="288" width="264" height="58" rx="5" fill="#fff" stroke="#5a6b7a" stroke-width="1.3"/>
<text x="292" y="306" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a2733">7 支感測器</text>
<text x="292" y="322" text-anchor="middle" font-size="9.5" fill="#4a5b6a">一個指令跑完，退出碼 0／1／2</text>
<text x="292" y="337" text-anchor="middle" font-size="9" fill="#25547f" font-family="monospace">run_all_sensors.py ｜ run_selftest.py</text>
<rect x="440" y="288" width="268" height="58" rx="5" fill="#fff" stroke="#5a6b7a" stroke-width="1.3"/>
<text x="574" y="306" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a2733">三個按鈕背後的程式</text>
<text x="574" y="322" text-anchor="middle" font-size="9.5" fill="#4a5b6a">邏輯只有一份，Windows 與 macOS 共用</text>
<text x="574" y="337" text-anchor="middle" font-size="9" fill="#25547f" font-family="monospace">checkpoint ｜ review_changes ｜ upgrade</text>
<rect x="742" y="304" width="196" height="32" rx="16" fill="#e4f1e9" stroke="#2e7d5b" stroke-width="1.3"/>
<text x="840" y="324" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f6b4a">✅ 可整包從 GitHub 換新</text>

<!-- divider -->
<line x1="28" y1="374" x2="952" y2="374" stroke="#b03a3a" stroke-width="1.6" stroke-dasharray="6 4"/>
<rect x="360" y="362" width="260" height="24" rx="12" fill="#fdeeee" stroke="#b03a3a" stroke-width="1.3"/>
<text x="490" y="379" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8f2d2d">以下是你的東西 —— 升級時一律不碰</text>

<!-- L3 user -->
<rect x="28" y="398" width="924" height="122" rx="7" fill="#fdeeee" stroke="#b03a3a" stroke-width="1.6"/>
<text x="42" y="420" font-size="13" font-weight="bold" fill="#8f2d2d">你的資料</text>
<text x="42" y="438" font-size="10.5" fill="#4a5b6a">只增不改寫</text>
<text x="42" y="454" font-size="10.5" fill="#8f2d2d" font-weight="bold">壞了無法還原</text>
<rect x="160" y="410" width="248" height="44" rx="5" fill="#fff" stroke="#b03a3a" stroke-width="1.6"/>
<text x="284" y="428" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f2d2d">PROJECT.md</text>
<text x="284" y="445" text-anchor="middle" font-size="9.5" fill="#4a5b6a">🔴 你唯一需要親筆填的檔案</text>
<rect x="424" y="410" width="140" height="44" rx="5" fill="#fff" stroke="#b03a3a" stroke-width="1.3"/>
<text x="494" y="428" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a2733">猜想台帳</text>
<text x="494" y="445" text-anchor="middle" font-size="9.5" fill="#4a5b6a">構想＋反證條件</text>
<rect x="580" y="410" width="140" height="44" rx="5" fill="#fff" stroke="#b03a3a" stroke-width="1.3"/>
<text x="650" y="428" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a2733">主張台帳</text>
<text x="650" y="445" text-anchor="middle" font-size="9.5" fill="#4a5b6a">錨點＋頁碼</text>
<rect x="736" y="410" width="202" height="44" rx="5" fill="#fff" stroke="#b03a3a" stroke-width="1.3"/>
<text x="837" y="428" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a2733">corpus/　corpus_md/</text>
<text x="837" y="445" text-anchor="middle" font-size="9.5" fill="#4a5b6a">原文 PDF 與程式化提取物</text>
<rect x="160" y="462" width="248" height="42" rx="5" fill="#fff" stroke="#b03a3a" stroke-width="1.3"/>
<text x="284" y="479" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a2733">incidents/MY_INCIDENTS.md</text>
<text x="284" y="495" text-anchor="middle" font-size="9.5" fill="#4a5b6a">你這個專案實際出過的事</text>
<rect x="424" y="462" width="296" height="42" rx="5" fill="#fff" stroke="#b03a3a" stroke-width="1.3"/>
<text x="572" y="479" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a2733">handoffs/　｜　NEXT_SESSION_MEMO.md</text>
<text x="572" y="495" text-anchor="middle" font-size="9.5" fill="#4a5b6a">交接封包　｜　狀態（每輪覆寫）</text>
<rect x="736" y="462" width="202" height="42" rx="5" fill="#fff" stroke="#b03a3a" stroke-width="1.3" stroke-dasharray="3 2"/>
<text x="837" y="479" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a2733">governance_config.json</text>
<text x="837" y="495" text-anchor="middle" font-size="9.5" fill="#4a5b6a">你決定 AI 能寫哪裡</text>

<!-- bottom rules -->
<rect x="28" y="538" width="924" height="142" rx="7" fill="#fffbea" stroke="#c9a227" stroke-width="1.5"/>
<text x="44" y="560" font-size="12.5" font-weight="bold" fill="#7d6209">這張圖真正要說的三件事</text>
<text x="44" y="586" font-size="11.5" fill="#2b2b2b"><tspan font-weight="bold">① 你只需要填一個檔案。</tspan>　其餘所有治理文件都由 AI 維護——<tspan font-weight="bold">你不需要打開它們，也不需要看懂它們。</tspan></text>
<text x="44" y="612" font-size="11.5" fill="#2b2b2b"><tspan font-weight="bold">② 上半部壞了就重新下載。</tspan>　所以治理 AI 對上半部有完整刪改權——<tspan font-weight="bold">給權限的理由不是信任，是那裡有還原路徑。</tspan></text>
<text x="44" y="638" font-size="11.5" fill="#2b2b2b"><tspan font-weight="bold">③ 下半部沒有還原路徑。</tspan>　預設 AI 不直接寫入，<tspan font-weight="bold">但那是預設值不是禁令</tspan>——要不要解除，寫在你的 <tspan font-family="monospace" font-size="10.5">governance_config.json</tspan> 裡。</text>
<text x="44" y="664" font-size="11" fill="#4a5b6a">⛔ 本框架不設一條你無法解除的禁令。一條解除不了的規則，會在你真的需要時被整個繞過——而繞過不會留下紀錄。</text>
</svg>
