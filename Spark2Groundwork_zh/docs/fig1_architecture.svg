<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="950" viewBox="0 0 1280 950" role="img" aria-labelledby="title desc">
<title id="title">框架可以換新，研究由你保有</title><desc id="desc">v1.4.5檔案歸屬與備份界線</desc>
<style>text{font-family:'Microsoft JhengHei','PingFang TC','Noto Sans CJK TC','Segoe UI',sans-serif;fill:#142b40}.muted{fill:#506779}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7b919f"/></marker></defs>
<rect width="1280" height="950" rx="24" fill="#f4f7fa"/>
<text x="48" y="44" font-size="14" font-weight="700" style="fill:#087f81">Spark2Groundwork  /  v1.4.5  /  資料歸屬</text>
<text x="48" y="91" font-size="34" font-weight="700" style="fill:#142b40">框架可以換新，研究由你保有</text>
<text x="48" y="125" font-size="19" font-weight="400" style="fill:#506779">更新前先辨認檔案歸屬；公版工具不等於專案自訂內容。</text>
<rect x="48" y="158" width="1184" height="284" rx="18" fill="#eaf1fb" stroke="#cfdded"/>
<text x="76" y="197" font-size="24" font-weight="700" style="fill:#2764ae">框架公版｜依更新指引逐包替換</text>
<text x="76" y="249" font-size="21" font-weight="700" style="fill:#142b40">governance/</text>
<text x="76" y="279" font-size="17" font-weight="400" style="fill:#506779">工作規則、查證規範與台帳規格</text>
<text x="648" y="249" font-size="21" font-weight="700" style="fill:#142b40">profiles/  ·  prompts/</text>
<text x="648" y="279" font-size="17" font-weight="400" style="fill:#506779">工作情境與提示模板</text>
<text x="76" y="334" font-size="21" font-weight="700" style="fill:#142b40">scripts/  ·  docs/</text>
<text x="76" y="364" font-size="17" font-weight="400" style="fill:#506779">檢查工具、入口說明與操作指引</text>
<text x="648" y="334" font-size="21" font-weight="700" style="fill:#142b40">README.md  ·  SETUP.md</text>
<text x="648" y="364" font-size="17" font-weight="400" style="fill:#506779">專案入口與設定；另含初始化提示、框架索引</text>
<text x="76" y="419" font-size="18" font-weight="400" style="fill:#2764ae">Windows／Mac 操作按鈕也是框架檔；先保全其中的自訂內容。</text>
<path d="M48 475H1232" stroke="#b75658" stroke-width="2"/>
<text x="48" y="507" font-size="20" font-weight="700" style="fill:#984a4c">紅線以下是專案自有內容，不用新版模板覆蓋。</text>
<rect x="48" y="529" width="1184" height="269" rx="18" fill="#e7f4f1" stroke="#badbd4"/>
<text x="76" y="568" font-size="24" font-weight="700" style="fill:#087f81">你的研究｜另做完整備份</text>
<text x="76" y="617" font-size="20" font-weight="700" style="fill:#142b40">PROJECT.md  ·  第一個想法.md</text>
<text x="76" y="645" font-size="17" font-weight="400" style="fill:#506779">研究方向、限制與最初構想</text>
<text x="648" y="617" font-size="20" font-weight="700" style="fill:#142b40">corpus/  ·  corpus_md/  ·  ledgers/</text>
<text x="648" y="645" font-size="17" font-weight="400" style="fill:#506779">文獻、提取物、猜想與主張紀錄</text>
<text x="76" y="695" font-size="20" font-weight="700" style="fill:#142b40">my/  ·  my/tools/</text>
<text x="76" y="723" font-size="17" font-weight="400" style="fill:#506779">自訂規則、事故紀錄、索引與自建工具</text>
<text x="648" y="695" font-size="20" font-weight="700" style="fill:#142b40">handoffs/  ·  NEXT_SESSION_MEMO.md</text>
<text x="648" y="723" font-size="17" font-weight="400" style="fill:#506779">交接紀錄與工作備忘錄</text>
<text x="76" y="773" font-size="18" font-weight="400" style="fill:#087f81">另含 governance_config.json、研究稿及任意自建資料夾。</text>
<rect x="48" y="822" width="1184" height="91" rx="18" fill="#fff" stroke="#d7e1e8"/>
<text x="72" y="854" font-size="18" font-weight="400" style="fill:#506779">更新前：在專案外備份完整資料夾，包含隱藏檔；Git 快照不能取代完整備份。</text>
<text x="72" y="883" font-size="18" font-weight="400" style="fill:#506779">.gitignore／.gitattributes 含自訂設定時須逐項合併；不要整份覆蓋。</text>
</svg>
