<text x="42" y="182" font-size="13" font-weight="bold" fill="#96661a">T1 spec</text>
<text x="42" y="200" font-size="10.5" fill="#4a5b6a">one incident</text>
<text x="42" y="216" font-size="10.5" fill="#4a5b6a">= one rule</text>
<rect x="160" y="172" width="172" height="38" rx="5" fill="#fff" stroke="#b8802f" stroke-width="1.3"/>
<text x="246" y="188" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a2733">RULES.md</text>
<text x="246" y="203" text-anchor="middle" font-size="9.5" fill="#4a5b6a">R-01 &#8211; R-35 | ids permanent</text>
<rect x="348" y="172" width="172" height="38" rx="5" fill="#fff" stroke="#b8802f" stroke-width="1.3"/>
<text x="434" y="188" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a2733">Incident_Log.md</text>
<text x="434" y="203" text-anchor="middle" font-size="9.5" fill="#4a5b6a">failure families and their mechanisms</text>
<rect x="536" y="172" width="172" height="38" rx="5" fill="#fff" stroke="#b8802f" stroke-width="1.3"/>
<text x="622" y="188" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a2733">Audit_Protocol.md</text>
<text x="622" y="203" text-anchor="middle" font-size="9.5" fill="#4a5b6a">adversarial audit protocol</text>
<rect x="160" y="216" width="264" height="38" rx="5" fill="#fff" stroke="#b8802f" stroke-width="1.3"/>
<text x="292" y="232" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a2733">policy/</text>
<text x="292" y="247" text-anchor="middle" font-size="9.5" fill="#4a5b6a">sources | model identity | handoff | external tools</text>
<rect x="440" y="216" width="268" height="38" rx="5" fill="#fff" stroke="#b8802f" stroke-width="1.3"/>
<text x="574" y="232" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a2733">profiles/  +  prompts/</text>
<text x="574" y="247" text-anchor="middle" font-size="9.5" fill="#4a5b6a">pick one setting  +  parts bin and templates</text>
<rect x="742" y="196" width="196" height="32" rx="16" fill="#e4f1e9" stroke="#2e7d5b" stroke-width="1.3"/>
<text x="840" y="216" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f6b4a">&#10003; replaceable from GitHub</text>

<!-- L2 tools -->
<rect x="28" y="276" width="924" height="82" rx="7" fill="#eef2f6" stroke="#5a6b7a" stroke-width="1.6"/>
<text x="42" y="298" font-size="13" font-weight="bold" fill="#3c4a56">Tooling</text>
<text x="42" y="316" font-size="10.5" fill="#4a5b6a">scripts/</text>
<text x="42" y="332" font-size="10.5" fill="#4a5b6a">harness/</text>
<rect x="160" y="288" width="264" height="58" rx="5" fill="#fff" stroke="#5a6b7a" stroke-width="1.3"/>
<text x="292" y="306" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a2733">sensor suite</text>
<text x="292" y="322" text-anchor="middle" font-size="9.5" fill="#4a5b6a">one command; exit 0 / 1 / 2</text>
<text x="292" y="337" text-anchor="middle" font-size="9" fill="#25547f" font-family="monospace">run_all_sensors.py ｜ run_selftest.py</text>
<rect x="440" y="288" width="268" height="58" rx="5" fill="#fff" stroke="#5a6b7a" stroke-width="1.3"/>
<text x="574" y="306" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a2733">the code behind the three buttons</text>
<text x="574" y="322" text-anchor="middle" font-size="9.5" fill="#4a5b6a">one implementation, shared by Windows and macOS</text>
<text x="574" y="337" text-anchor="middle" font-size="9" fill="#25547f" font-family="monospace">checkpoint ｜ review_changes ｜ upgrade</text>
<rect x="742" y="304" width="196" height="32" rx="16" fill="#e4f1e9" stroke="#2e7d5b" stroke-width="1.3"/>
<text x="840" y="324" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f6b4a">&#10003; replaceable from GitHub</text>

<!-- divider -->
<line x1="28" y1="374" x2="952" y2="374" stroke="#b03a3a" stroke-width="1.6" stroke-dasharray="6 4"/>
<rect x="320" y="362" width="340" height="24" rx="12" fill="#fdeeee" stroke="#b03a3a" stroke-width="1.3"/>
<text x="490" y="379" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8f2d2d">Below this line is yours &#8212; never touched by an upgrade</text>

<!-- L3 user -->
<rect x="28" y="398" width="924" height="122" rx="7" fill="#fdeeee" stroke="#b03a3a" stroke-width="1.6"/>
<text x="42" y="420" font-size="13" font-weight="bold" fill="#8f2d2d">Your data</text>
<text x="42" y="438" font-size="10.5" fill="#4a5b6a">append-only</text>
<text x="42" y="454" font-size="10.5" fill="#8f2d2d" font-weight="bold">no way back if lost</text>
<rect x="160" y="410" width="248" height="44" rx="5" fill="#fff" stroke="#b03a3a" stroke-width="1.6"/>
<text x="284" y="428" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f2d2d">PROJECT.md</text>
<text x="284" y="445" text-anchor="middle" font-size="9.5" fill="#4a5b6a">the only file you fill in yourself</text>
<rect x="424" y="410" width="140" height="44" rx="5" fill="#fff" stroke="#b03a3a" stroke-width="1.3"/>
<text x="494" y="428" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a2733">Conjecture Ledger</text>
<text x="494" y="445" text-anchor="middle" font-size="9.5" fill="#4a5b6a">ideas + falsification conditions</text>
<rect x="580" y="410" width="140" height="44" rx="5" fill="#fff" stroke="#b03a3a" stroke-width="1.3"/>
<text x="650" y="428" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a2733">Claim Ledger</text>
<text x="650" y="445" text-anchor="middle" font-size="9.5" fill="#4a5b6a">anchors + pages</text>
<rect x="736" y="410" width="202" height="44" rx="5" fill="#fff" stroke="#b03a3a" stroke-width="1.3"/>
<text x="837" y="428" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a2733">corpus/　corpus_md/</text>
<text x="837" y="445" text-anchor="middle" font-size="9.5" fill="#4a5b6a">source PDFs and their extractions</text>
<rect x="160" y="462" width="248" height="42" rx="5" fill="#fff" stroke="#b03a3a" stroke-width="1.3"/>
<text x="284" y="479" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a2733">incidents/MY_INCIDENTS.md</text>
<text x="284" y="495" text-anchor="middle" font-size="9.5" fill="#4a5b6a">what actually went wrong in your project</text>
<rect x="424" y="462" width="296" height="42" rx="5" fill="#fff" stroke="#b03a3a" stroke-width="1.3"/>
<text x="572" y="479" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a2733">handoffs/　｜　NEXT_SESSION_MEMO.md</text>
<text x="572" y="495" text-anchor="middle" font-size="9.5" fill="#4a5b6a">handoff packets  |  state (overwritten each round)</text>
<rect x="736" y="462" width="202" height="42" rx="5" fill="#fff" stroke="#b03a3a" stroke-width="1.3" stroke-dasharray="3 2"/>
<text x="837" y="479" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a2733">governance_config.json</text>
<text x="837" y="495" text-anchor="middle" font-size="9.5" fill="#4a5b6a">you decide what the AI may write to</text>

<!-- bottom rules -->
<rect x="28" y="538" width="924" height="142" rx="7" fill="#fffbea" stroke="#c9a227" stroke-width="1.5"/>
<text x="44" y="560" font-size="12.5" font-weight="bold" fill="#7d6209">What this figure is actually saying</text>
<text x="44" y="586" font-size="11.5" fill="#2b2b2b"><tspan font-weight="bold">1. You fill in exactly one file.</tspan> Every other governance document is AI-maintained &#8212; <tspan font-weight="bold">you never need to open them or understand them.</tspan></text>
<text x="44" y="612" font-size="11.5" fill="#2b2b2b"><tspan font-weight="bold">2. Break the top half and you re-download it.</tspan> So the governance AI has full write access there &#8212; <tspan font-weight="bold">the reason is not trust; it is that a restore path exists.</tspan></text>
<text x="44" y="638" font-size="11.5" fill="#2b2b2b"><tspan font-weight="bold">3. The bottom half has no restore path.</tspan> By default the AI does not write there, <tspan font-weight="bold">but that is a default, not a prohibition</tspan> &#8212; lifting it is one line in your <tspan font-family="monospace" font-size="10.5">governance_config.json</tspan>.</text>
<text x="44" y="664" font-size="11" fill="#4a5b6a">This framework sets no prohibition you cannot lift. A rule you cannot lift gets routed around when you truly need it &#8212; and routing around leaves no record.</text>
</svg>
