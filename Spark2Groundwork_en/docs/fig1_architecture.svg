<text x="490" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2733">Architecture — what belongs to the framework, what belongs to you</text>
<text x="490" y="49" text-anchor="middle" font-size="12" fill="#4a5b6a">The line is not importance. It is who owns a file. The framework's is replaced wholesale; yours is never touched.</text>
