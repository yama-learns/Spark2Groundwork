<text x="490" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a2733">Architecture &#8212; what is the framework, and what is yours</text>
<text x="490" y="49" text-anchor="middle" font-size="12" fill="#4a5b6a">The line is not importance; it is <tspan font-weight="bold" fill="#1a2733">&#8220;can it be restored after it breaks&#8221;</tspan>. Restorable packages are replaced wholesale; unrestorable ones are never touched.</text>

<!-- L0 T0 -->
<rect x="28" y="68" width="924" height="80" rx="7" fill="#eef4fa" stroke="#3d72a4" stroke-width="1.6"/>
<text x="42" y="90" font-size="13" font-weight="bold" fill="#25547f">T0 required</text>
<text x="42" y="108" font-size="10.5" fill="#4a5b6a">almost never changes</text>
<text x="42" y="124" font-size="10.5" fill="#4a5b6a">highest precedence</text>
<rect x="160" y="80" width="248" height="56" rx="5" fill="#fff" stroke="#3d72a4" stroke-width="1.4"/>
<text x="284" y="101" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a2733">governance/AGENTS.md</text>
<text x="284" y="120" text-anchor="middle" font-size="10" fill="#4a5b6a">verification | academic bottom line | decision rights</text>
<rect x="416" y="80" width="294" height="56" rx="5" fill="#fff" stroke="#3d72a4" stroke-width="1.4"/>
<text x="563" y="101" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a2733">governance/WORKFLOW_CONSTITUTION.md</text>
<text x="563" y="120" text-anchor="middle" font-size="10" fill="#4a5b6a">topology | evidence chain | rituals | write scope | cost ceiling</text>
<rect x="742" y="92" width="196" height="32" rx="16" fill="#e4f1e9" stroke="#2e7d5b" stroke-width="1.3"/>
<text x="840" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f6b4a">&#10003; replaceable from GitHub</text>

