<path d="M160,192 L151,192 L151,506 L156,506" fill="none" stroke="#2e7d5b" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#ag)"/>
<text x="168" y="300" font-size="10" font-weight="bold" fill="#1f6b4a">on upgrade: a tool copies the framework's new rules in verbatim — ⛔ your P-xx is untouched</text>
<rect x="28" y="664" width="924" height="132" rx="7" fill="#fffbea" stroke="#c9a227" stroke-width="1.5"/>
<text x="44" y="686" font-size="12.5" font-weight="bold" fill="#7d6209">What this figure is actually saying</text>
<text x="44" y="712" font-size="11.5" fill="#2b2b2b"><tspan font-weight="bold">① You fill in one file.</tspan>　An AI maintains the rest — you never need to open them or understand them.</text>
<text x="44" y="738" font-size="11.5" fill="#2b2b2b"><tspan font-weight="bold">② If the top half breaks, download it again.</tspan>　That is why the governance AI may rewrite it — the reason is a restore path, not trust.</text>
<text x="44" y="764" font-size="11.5" fill="#2b2b2b"><tspan font-weight="bold">③ A file may have exactly one owner.</tspan>　Mix the framework's content with yours and an upgrade will lose one of them — so your rules live in my/, ⛔ not governance/.</text>
<text x="44" y="790" font-size="11" fill="#4a5b6a">⛔ This framework sets no prohibition you cannot lift. A rule you cannot lift gets bypassed the moment you truly need it — and a bypass leaves no record.</text>
</svg>
