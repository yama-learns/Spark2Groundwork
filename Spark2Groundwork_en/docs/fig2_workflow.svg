<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040" role="img" aria-labelledby="title desc">
<title id="title">From an idea to a proposal, with evidence at each step</title><desc id="desc">Separate research evidence, automated checks and human review</desc>
<style>text{font-family:'Microsoft JhengHei','PingFang TC','Noto Sans CJK TC','Segoe UI',sans-serif;fill:#142b40}.muted{fill:#506779}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7b919f"/></marker></defs>
<rect width="1280" height="1040" rx="24" fill="#f4f7fa"/>
<text x="48" y="44" font-size="14" font-weight="700" style="fill:#087f81">Spark2Groundwork  /  v1.4.5  /  RESEARCH WORKFLOW</text>
<text x="48" y="91" font-size="34" font-weight="700" style="fill:#142b40">From an idea to a proposal, with evidence at each step</text>
<text x="48" y="125" font-size="19" font-weight="400" style="fill:#506779">AI helps organise and check. You make research decisions and confirm what you have reviewed.</text>
<rect x="48" y="158" width="356" height="96" rx="18" fill="#fff" stroke="#d7e1e8"/>
<text x="70" y="196" font-size="23" font-weight="700" style="fill:#142b40">Original idea</text>
<text x="70" y="227" font-size="17" font-weight="400" style="fill:#506779">Keep motivations and unknowns</text>
<path d="M413 206L453 206" fill="none" stroke="#7b919f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="462" y="158" width="356" height="96" rx="18" fill="#fff" stroke="#d7e1e8"/>
<text x="484" y="196" font-size="23" font-weight="700" style="fill:#142b40">Conjecture ledger</text>
<text x="484" y="227" font-size="17" font-weight="400" style="fill:#506779">Record reasons and falsifiers</text>
<path d="M827 206L867 206" fill="none" stroke="#7b919f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="876" y="158" width="356" height="96" rx="18" fill="#fff" stroke="#d7e1e8"/>
<text x="898" y="196" font-size="23" font-weight="700" style="fill:#142b40">Questions and proposal</text>
<text x="898" y="227" font-size="17" font-weight="400" style="fill:#506779">State assumptions and scope</text>
<rect x="48" y="275" width="356" height="96" rx="18" fill="#fff" stroke="#d7e1e8"/>
<text x="70" y="313" font-size="23" font-weight="700" style="fill:#142b40">Sources and extracted text</text>
<text x="70" y="344" font-size="17" font-weight="400" style="fill:#506779">Preserve source locations</text>
<path d="M413 323L453 323" fill="none" stroke="#7b919f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="462" y="275" width="356" height="96" rx="18" fill="#fff" stroke="#d7e1e8"/>
<text x="484" y="313" font-size="23" font-weight="700" style="fill:#142b40">Claim ledger</text>
<text x="484" y="344" font-size="17" font-weight="400" style="fill:#506779">Anchors, pages and check status</text>
<path d="M827 323L867 323" fill="none" stroke="#7b919f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="876" y="275" width="356" height="96" rx="18" fill="#fff" stroke="#d7e1e8"/>
<text x="898" y="313" font-size="23" font-weight="700" style="fill:#142b40">Research argument</text>
<text x="898" y="344" font-size="17" font-weight="400" style="fill:#506779">Judge support for the inference</text>
<rect x="48" y="400" width="574" height="172" rx="18" fill="#eaf1fb" stroke="#cfdded"/>
<rect x="644" y="400" width="588" height="172" rx="18" fill="#e7f4f1" stroke="#badbd4"/>
<text x="72" y="440" font-size="23" font-weight="700" style="fill:#2764ae">What automated checks can help with</text>
<text x="72" y="477" font-size="18" font-weight="400" style="fill:#506779">Text anchors, required fields and referenced files</text>
<text x="72" y="506" font-size="18" font-weight="400" style="fill:#506779">Consistency of defined cross-document rules</text>
<text x="72" y="535" font-size="18" font-weight="400" style="fill:#506779">Distinguish passed, defect found and inconclusive</text>
<text x="668" y="440" font-size="23" font-weight="700" style="fill:#087f81">What you need to judge and decide</text>
<text x="668" y="477" font-size="18" font-weight="400" style="fill:#506779">Does the source support the inference and method?</text>
<text x="668" y="506" font-size="18" font-weight="400" style="fill:#506779">Can findings generalise? Which limits still apply?</text>
<text x="668" y="535" font-size="18" font-weight="400" style="fill:#506779">Finding the text does not establish the conclusion.</text>
<text x="48" y="623" font-size="25" font-weight="700" style="fill:#142b40">Each round: agree on the task, then review the result</text>
<rect x="48" y="654" width="220" height="112" rx="18" fill="#fff" stroke="#d2e0e2"/>
<text x="64" y="684" font-size="14" font-weight="700" style="fill:#087f81">01</text>
<text x="64" y="717" font-size="20" font-weight="700" style="fill:#142b40">AI works</text>
<text x="64" y="746" font-size="16" font-weight="400" style="fill:#506779">Leave a handoff</text>
<path d="M271 710L284 710" fill="none" stroke="#7b919f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="289" y="654" width="220" height="112" rx="18" fill="#fff" stroke="#d2e0e2"/>
<text x="305" y="684" font-size="14" font-weight="700" style="fill:#087f81">02</text>
<text x="305" y="717" font-size="20" font-weight="700" style="fill:#142b40">Save progress</text>
<text x="305" y="746" font-size="16" font-weight="400" style="fill:#506779">Not human review</text>
<path d="M512 710L525 710" fill="none" stroke="#7b919f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="530" y="654" width="220" height="112" rx="18" fill="#fff" stroke="#d2e0e2"/>
<text x="546" y="684" font-size="14" font-weight="700" style="fill:#087f81">03</text>
<text x="546" y="717" font-size="20" font-weight="700" style="fill:#142b40">Check &amp; inspect</text>
<text x="546" y="746" font-size="16" font-weight="400" style="fill:#506779">Resolve gaps</text>
<path d="M753 710L766 710" fill="none" stroke="#7b919f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="771" y="654" width="220" height="112" rx="18" fill="#fff" stroke="#d2e0e2"/>
<text x="787" y="684" font-size="14" font-weight="700" style="fill:#087f81">04</text>
<text x="787" y="717" font-size="20" font-weight="700" style="fill:#142b40">You decide</text>
<text x="787" y="746" font-size="16" font-weight="400" style="fill:#506779">Read the contents</text>
<path d="M994 710L1007 710" fill="none" stroke="#7b919f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1012" y="654" width="220" height="112" rx="18" fill="#dcf0e9" stroke="#d2e0e2"/>
<text x="1028" y="684" font-size="14" font-weight="700" style="fill:#087f81">05</text>
<text x="1028" y="717" font-size="20" font-weight="700" style="fill:#142b40">Human snapshot</text>
<text x="1028" y="746" font-size="16" font-weight="400" style="fill:#506779">Only after review</text>
<rect x="48" y="794" width="1184" height="133" rx="18" fill="#fff5e6" stroke="#ead6b4"/>
<text x="72" y="831" font-size="23" font-weight="700" style="fill:#865516">Saved is not reviewed. Passing checks is not proof of sound research.</text>
<text x="72" y="868" font-size="18" font-weight="400" style="fill:#506779">Review initial contents and establish a baseline first. Without one, do not assume there is no unread work.</text>
<text x="72" y="897" font-size="18" font-weight="400" style="fill:#506779">AI must not confirm human review. Snapshots may exclude files; keep complete backups of important material.</text>
<text x="48" y="974" font-size="18" font-weight="400" style="fill:#506779">Other entry points: sync rules and check updates. See SETUP.md and docs/UPDATE.md in your project.</text>
<text x="48" y="1007" font-size="16" font-weight="400" style="fill:#506779">This is the v1.4.5 workflow. The v2 preview describes its planned layout and capabilities separately.</text>
</svg>
